# Unit tests on every push and pull request. No checkpoint, dataset or secret is available here, so the
# checkpoint-dependent test modules are reported as NOT RUN and allowed (--allow-missing-checkpoint); every other
# module must pass. The browser suites are left out (--no-browser). The repository check fails on secrets, weights,
# large files, personal paths or missing required files.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyTorch (CPU) and the test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-test.txt
      - name: Repository check
        run: python tools/check_repository.py
      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONIOENCODING: utf-8
        run: python -B run_all_tests.py --no-browser --allow-missing-checkpoint
